name: Nightly
on:
  schedule:
    - cron: '0 5 * * *'
  workflow_dispatch:
jobs:
  convergence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test -w @relay/core -- convergence
        env:
          RELAY_FC_RUNS: 10000
