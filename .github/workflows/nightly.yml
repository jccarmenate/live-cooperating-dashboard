name: Nightly
on:
  schedule:
    - cron: '0 5 * * *'
  workflow_dispatch:
jobs:
  convergence:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # 10,000 fast-check runs per property take far longer than vitest's 5 s default.
      - run: npm test -w @relay/core -- convergence --testTimeout=1200000
        env:
          RELAY_FC_RUNS: 10000
